openapi: 3.0.1

info:
  version: ${version}
  title: DARTS Common Platform API
  contact:
    name: DARTS team
  description: |-
    Draft API for Common Platform to submit daily-list XML and JSON events to DARTS.
    Request formats, retry behaviour and Marketplace configuration remain subject to agreement.
  x-contract-status: draft

servers:
  - url: http://localhost:4550
    description: Local development

tags:
  - name: CommonPlatformDailyLists
    description: Common Platform daily-list XML submissions.
  - name: CommonPlatformEvents
    description: Common Platform event JSON submissions.

security:
  - marketplaceOAuth2: [ ]
    marketplaceSubscriptionKey: [ ]

paths:
  /external/cp/daily-lists:
    post:
      tags:
        - CommonPlatformDailyLists
      operationId: submitCommonPlatformDailyList
      summary: Submit a Common Platform daily list
      description: |-
        Submit a daily-list XML document without a SOAP envelope. The source system is CPP.
        Success acknowledges receipt, not completion of downstream processing.
      x-darts-required-role: CPP
      parameters:
        - $ref: '#/components/parameters/MessageId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        description: Complete daily-list XML document.
        content:
          application/xml:
            schema:
              type: string
              minLength: 1
              # TODO: Confirm with CP/PlatOps against expected daily-list sizes and deployed request-byte limits.
              # Provisional character limit; no explicit daily-list limit found in darts-gateway.
              maxLength: 10485760
              description: Raw daily-list XML.
      responses:
        '200':
          $ref: '#/components/responses/SubmissionReceived'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/BusinessValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /external/cp/events:
    post:
      tags:
        - CommonPlatformEvents
      operationId: submitCommonPlatformEvent
      summary: Submit a Common Platform event
      description: |-
        Submit event metadata and a JSON event document, with optional retention data.
        Success acknowledges receipt, not completion of downstream processing.
      x-darts-required-role: CPP
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        description: Event metadata and document.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommonPlatformEventRequest'
            examples:
              juryIn:
                summary: Jury in
                value:
                  message_id: 00000000-0000-4000-8000-000000000001
                  type: '1000'
                  sub_type: '1051'
                  document:
                    event_id: '12345678'
                    year: 2026
                    month: 9
                    day: 16
                    hour: 12
                    minute: 1
                    second: 34
                    courthouse: EXAMPLE COURT
                    courtroom: '3'
                    case_numbers:
                      - T20260001
                    event_text: Jury in
              eventWithRetentionPolicy:
                summary: Event with retention data
                description: Illustrative event type and subtype.
                value:
                  message_id: 00000000-0000-4000-8000-000000000003
                  type: '<cp-event-type>'
                  sub_type: '<cp-event-subtype>'
                  document:
                    event_id: '12345679'
                    year: 2026
                    month: 9
                    day: 16
                    hour: 12
                    minute: 2
                    second: 0
                    courthouse: EXAMPLE COURT
                    courtroom: '3'
                    case_numbers:
                      - T20260001
                    event_text: Example event carrying retention information
                    retention_policy:
                      case_retention_fixed_policy: '3'
                      case_total_sentence: 1Y2M0D
      responses:
        '201':
          $ref: '#/components/responses/EventCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/BusinessValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    marketplaceOAuth2:
      type: oauth2
      description: |-
        Application-to-application access using OAuth2 client credentials, mapped to DARTS CPP access.
        The token URL is a placeholder pending Marketplace configuration.
      flows:
        clientCredentials:
          tokenUrl: https://marketplace-auth.example.invalid/oauth2/v2.0/token
          scopes: { }
    marketplaceSubscriptionKey:
      type: apiKey
      in: header
      name: Ocp-Apim-Subscription-Key
      description: Marketplace subscription key validated by APIM in addition to the bearer access token.

  parameters:
    MessageId:
      name: X-Message-Id
      in: header
      required: true
      description: |-
        Message identifier replacing SOAP messageId. Reuse it when retrying the same submission.
        Reusing an identifier does not guarantee idempotent handling.
      schema:
        type: string
        minLength: 1
        maxLength: 256
      example: 00000000-0000-4000-8000-000000000001
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: Identifier for tracing a request across CP, Marketplace and DARTS.
      schema:
        type: string
        minLength: 1
        maxLength: 256
      example: 00000000-0000-4000-8000-000000000002

  responses:
    SubmissionReceived:
      description: Daily list received.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommonPlatformSubmissionResponse'
          example:
            code: '200'
            message: OK
    EventCreated:
      description: Event created.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommonPlatformSubmissionResponse'
          example:
            code: '201'
            message: CREATED
    BadRequest:
      description: Malformed XML/JSON, missing required metadata, or invalid submission data.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CommonPlatformProblem'
    Unauthenticated:
      description: |-
        Missing or invalid bearer token or APIM subscription key.
      headers:
        WWW-Authenticate:
          description: Bearer challenge for missing or invalid bearer authentication; not required for subscription-key failures.
          schema:
            type: string
          example: Bearer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CommonPlatformProblem'
    Forbidden:
      description: The authenticated caller lacks permission to submit CP data.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CommonPlatformProblem'
    NotFound:
      description: Courthouse or event handler mapping not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CommonPlatformProblem'
    PayloadTooLarge:
      description: The request exceeds the payload limit.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CommonPlatformProblem'
    UnsupportedMediaType:
      description: The request content type is not supported by the operation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CommonPlatformProblem'
    BusinessValidationError:
      description: The submission failed business validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CommonPlatformProblem'
    TooManyRequests:
      description: The request rate limit has been exceeded.
      headers:
        Retry-After:
          description: Delay in seconds before retrying.
          schema:
            type: integer
            minimum: 0
          example: 60
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CommonPlatformProblem'
    InternalServerError:
      description: An unexpected DARTS error occurred.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CommonPlatformProblem'
    ServiceUnavailable:
      description: The CP integration is temporarily unavailable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CommonPlatformProblem'

  schemas:
    CommonPlatformEventRequest:
      type: object
      description: Event metadata and document. Message types are strings.
      required:
        - message_id
        - type
        - sub_type
        - document
      properties:
        message_id:
          type: string
          minLength: 1
          maxLength: 256
          description: Submission identifier; reuse it when retrying the same message.
        type:
          type: string
          minLength: 1
          description: CP message type.
        sub_type:
          type: string
          minLength: 1
          description: CP message subtype.
        document:
          $ref: '#/components/schemas/CommonPlatformEventDocument'
    CommonPlatformEventDocument:
      type: object
      description: |-
        Event details. Date and time components represent Europe/London court time
        and must form a valid calendar date and time.
      required:
        - event_id
        - year
        - month
        - day
        - hour
        - minute
        - second
        - courthouse
        - case_numbers
      properties:
        event_id:
          type: string
          pattern: '^-?[0-9]+$'
          description: Numeric event identifier, which may be negative.
          example: '-12345678'
        year:
          type: integer
          minimum: 1
          maximum: 9999
          description: XML Y attribute.
        month:
          type: integer
          minimum: 1
          maximum: 12
          description: XML M attribute.
        day:
          type: integer
          minimum: 1
          maximum: 31
          description: XML D attribute; must form a valid date with year and month.
        hour:
          type: integer
          minimum: 0
          maximum: 23
          description: XML H attribute in local court time.
        minute:
          type: integer
          minimum: 0
          maximum: 59
          description: XML MIN attribute.
        second:
          type: integer
          minimum: 0
          maximum: 59
          description: XML S attribute.
        courthouse:
          type: string
          minLength: 1
          maxLength: 50
          description: Courthouse name.
        courtroom:
          type: string
          maxLength: 25
          description: Courtroom name.
        case_numbers:
          type: array
          minItems: 1
          description: Case numbers associated with the event.
          items:
            type: string
            minLength: 1
            maxLength: 25
        event_text:
          type: string
          maxLength: 2000
          description: Event text.
        retention_policy:
          $ref: '#/components/schemas/CommonPlatformRetentionPolicy'
    CommonPlatformRetentionPolicy:
      type: object
      description: |-
        Optional retention data. Both fields are optional strings, passed unchanged
        without defaults when omitted.
      properties:
        case_retention_fixed_policy:
          type: string
          description: Retention policy identifier.
          example: '3'
        case_total_sentence:
          type: string
          description: Total sentence in the source format.
          example: 1Y2M0D
    CommonPlatformSubmissionResponse:
      type: object
      description: Submission acknowledgement.
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: HTTP success status as a string.
          enum:
            - '200'
            - '201'
        message:
          type: string
          description: HTTP success status name.
          enum:
            - OK
            - CREATED
    CommonPlatformProblem:
      type: object
      description: Problem details for an unsuccessful request.
      properties:
        type:
          type: string
          format: uri-reference
          description: URI reference identifying the problem type.
          example: about:blank
        title:
          type: string
          description: Short summary of the problem type.
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: HTTP response status for this occurrence.
        detail:
          type: string
          description: Explanation of this problem occurrence without sensitive implementation details.
        instance:
          type: string
          format: uri-reference
          description: URI reference identifying this problem occurrence.
