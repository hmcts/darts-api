name: Playwright E2E

on:
  push:
    branches: [dma-264-spike-pr-e2e-testing]
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request number whose pw_e2e label should be checked
        required: true
        type: number

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || startsWith(github.event.label.name, 'pw_e2e')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]
    steps:
      - name: Find Playwright branch from label
        id: branch
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_LABEL: ${{ github.event.label.name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_BRANCH: ${{ github.ref_name }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "push" ]]; then
            pull_request_number=$(curl --fail --silent --show-error --retry 2 \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${GITHUB_REPOSITORY_OWNER}%3A${EVENT_BRANCH}&per_page=100" \
              | jq -r '.[0].number // empty')
            if [[ -z "$pull_request_number" ]]; then
              echo "No open pull request found for branch $EVENT_BRANCH." >&2
              exit 1
            fi
            labels=$(curl --fail --silent --show-error --retry 2 \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${pull_request_number}/labels?per_page=100" \
              | jq -r '.[].name')
            echo "pull_request_number=$pull_request_number" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ ! "$PULL_REQUEST_NUMBER" =~ ^[0-9]+$ ]]; then
              echo "A valid pull request number is required." >&2
              exit 1
            fi
            labels=$(curl --fail --silent --show-error --retry 2 \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PULL_REQUEST_NUMBER}/labels?per_page=100" \
              | jq -r '.[].name')
            pull_request_number="$PULL_REQUEST_NUMBER"
            echo "pull_request_number=$pull_request_number" >> "$GITHUB_OUTPUT"
          else
            matching_label="$EVENT_LABEL"
            echo "pull_request_number=$EVENT_PR_NUMBER" >> "$GITHUB_OUTPUT"
          fi

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            matching_label=$(printf '%s\n' "$labels" | grep -E '^pw_e2e:[0-9]+$' | head -n 1 || true)
            if [[ -z "$matching_label" ]]; then
              matching_label=$(printf '%s\n' "$labels" | grep -Fx 'pw_e2e' | head -n 1 || true)
            fi
          fi

          if [[ "$matching_label" == "pw_e2e" ]]; then
            echo "ref=master" >> "$GITHUB_OUTPUT"
          elif [[ "$matching_label" =~ ^pw_e2e:([0-9]+)$ ]]; then
            echo "ref=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "No supported pw_e2e label found on the pull request." >&2
            exit 1
          fi

      - name: Check out Playwright automation repo
        uses: actions/checkout@v4
        with:
          repository: hmcts/darts-automation-playwright
          ref: dma-264-spike-pr-e2e-testing
          path: playwright
          persist-credentials: false

      - name: Print E2E folder contents
        working-directory: playwright
        run: |
          ls -laR e2e

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install Playwright dependencies
        working-directory: playwright
        run: yarn install --immutable

      - name: Install Playwright browsers
        working-directory: playwright
        run: yarn playwright install --with-deps

      - name: Run E2E tests
        working-directory: playwright
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: ${{ github.workspace }}/playwright/blob-report
        run: yarn test:e2e --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} --reporter=list,blob

      - name: Upload shard report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: playwright/blob-report
          if-no-files-found: error
          retention-days: 1

  merge-reports:
    name: Combined Playwright report
    needs: [playwright]
    if: ${{ !cancelled() && needs.playwright.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Playwright automation repo
        uses: actions/checkout@v4
        with:
          repository: hmcts/darts-automation-playwright
          ref: dma-264-spike-pr-e2e-testing
          path: playwright
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install Playwright dependencies
        working-directory: playwright
        run: yarn install --immutable

      - name: Download shard reports
        uses: actions/download-artifact@v4
        with:
          path: playwright/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge reports into HTML
        working-directory: playwright
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: ${{ github.workspace }}/playwright/playwright-report
          PLAYWRIGHT_HTML_OPEN: never
        run: yarn playwright merge-reports --reporter=html ./all-blob-reports

      - name: Upload HTML report
        id: html-report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report-${{ github.run_attempt }}
          path: playwright/playwright-report
          if-no-files-found: error
          retention-days: 14

      - name: Link report in workflow summary
        env:
          REPORT_URL: ${{ steps.html-report.outputs.artifact-url }}
        run: |
          {
            echo "## Playwright E2E results"
            echo
            printf '[Download the combined HTML report](%s)\n' "$REPORT_URL"
            echo
            echo 'Extract the download and open index.html to view results from both shards, timings, and failure details.'
          } >> "$GITHUB_STEP_SUMMARY"
